name: BGMI Group Automation Timers

on:
  schedule:
    # Triggers exactly at 00:00 AM (Midnight) IST
    - cron: '0 0 * * *'
      timezone: 'Asia/Kolkata'
    # Triggers exactly at 07:00 AM IST Morning
    - cron: '0 7 * * *'
      timezone: 'Asia/Kolkata'

jobs:
  ping_endpoints:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate IST Hour and Trigger Vercel Webhook
        run: |
          # Getting the current hour formatted directly to Indian Standard Time
          IST_HOUR=$(TZ="Asia/Kolkata" date +%H)
          echo "Current hour in India is: $IST_HOUR"
          
          if [ "$IST_HOUR" -eq "00" ] || [ "$IST_HOUR" -eq "24" ]; then
            echo "Executing Midnight Lock Routine..."
            curl -X POST https://your-vercel-project.vercel.app/secret-lock-endpoint
          elif [ "$IST_HOUR" -eq "07" ]; then
            echo "Executing Morning Unlock and Rule Announcement..."
            curl -X POST https://your-vercel-project.vercel.app/secret-unlock-endpoint
          else
            echo "Workflow triggered slightly outside window; running fallback diagnostic check..."
            curl -X POST https://your-vercel-project.vercel.app/secret-lock-endpoint
          fi
